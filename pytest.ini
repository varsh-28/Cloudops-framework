[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

base_url = http://127.0.0.1:8000

addopts =
    -v
    --html=reports/report.html
    --self-contained-html
    --junitxml=reports/junit.xml

markers =
    api: API tests
    ui: UI tests
    smoke: Critical smoke tests
    regression: Regression tests